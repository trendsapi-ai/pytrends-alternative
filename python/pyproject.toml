[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pytrends-alternative"
version = "1.0.2"
description = "Managed Google Trends client for Python. Drop-in mindset for archived pytrends: history, growth, and 30+ other sources via the Trends API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Trends API", email = "hello@trendsapi.ai" }]
keywords = [
  "pytrends",
  "pytrends-alternative",
  "google-trends",
  "google-trends-api",
  "trendsapi",
  "seo",
  "keyword-research",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["trendsapi>=1.0.0"]

[project.urls]
Homepage = "https://trendsapi.ai"
Documentation = "https://trendsapi.ai/#quickstart"
Repository = "https://github.com/trendsapi-ai/pytrends-alternative"
"Bug Tracker" = "https://github.com/trendsapi-ai/pytrends-alternative/issues"
"Get API key" = "https://trendsapi.ai/#get-key"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrends_alternative"]

[tool.hatch.build.targets.sdist]
include = ["src/pytrends_alternative", "README.md", "LICENSE", "pyproject.toml", "examples"]
